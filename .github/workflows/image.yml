# The app's image (the Dockerfile's `app`), for amd64 and arm64, published to the GitHub Container
# Registry once the checks pass: ghcr.io/klchoi/hyper-reader, as `latest` and as the commit
# (`sha-1a2b3c4`) for master, and as the version for a tag v1.2.3. The actions are pinned to the
# commit of their release (the job can publish packages, and hands one of them its token);
# Dependabot keeps the pins current (.github/dependabot.yml).
name: image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the image tried before it is published: started on a library of one book, it answers
      # that it is well, the page, and the book
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          load: true
          tags: hyper-reader:try
          cache-from: type=gha
      - name: Try the image
        run: |
          mkdir -p try/books try/data && chmod 777 try/data
          printf 'Chương 1: Một\n\nNàng đi qua núi.\n' > 'try/books/Thử (1-1 chương) (thử).txt'
          docker run -d --name try -p 127.0.0.1:8080:8080 -v "$PWD/try/books:/books:ro" -v "$PWD/try/data:/data" hyper-reader:try
          # (each answer is read whole before it is looked at: grep -q stops reading at what it
          # looks for, and the shell takes curl's failing to finish for a failed step)
          ask() { curl -fsS "http://127.0.0.1:8080$1" || true; }
          for i in $(seq 1 30); do [ -n "$(ask /api/hello)" ] && break; sleep 1; done
          for i in $(seq 1 30); do [[ "$(ask '/api/books?limit=1')" == *'"total":1'* ]] && break; sleep 1; done
          [[ "$(ask '/api/books?q=thu')" == *'"title":"Thử"'* ]]
          [[ "$(ask /)" == *'<title>Text Reader</title>'* ]]
          test "$(docker inspect -f '{{.State.Running}}' try)" = true
      - name: What the image said
        if: always()
        run: docker logs try || true

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
