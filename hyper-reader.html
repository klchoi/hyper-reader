mber\n    skippedBooksMax: 3,  // books never named that a named one may skip over\n  },\n  // 4. how far a shape is trusted, by how much of it landed on the path\n  trust: { scale: 6 },\n  // 4. a heading with a line or so before the next, in a book of long chapters\n  tiny: { typicalAtLeast: 30, lines: 2 },\n  // 4. a contents list at the head of a book: this many entries, from the least to the most\n  contents: { minEntries: 3, maxEntries: 60 },\n  // 4. weak headings taken back to fill a gap: the first of a book up to this number\n  fill: { firstMax: 4 },\n  // 5. the drafts\n  drafts: {\n    titleMax: 100,       // characters of a title, before a paragraph running on is cut\n    seriesMin: 8,        // headings that begin alike, to be a series\n    seriesOver: 1.2,     // ...and more than the numbered headings by this factor\n    pageParagraphs: 60,  // paragraphs to a page, when a book has no headings\n    headingLines: 2,     // lines of a chapter that holds nothing but its heading (of its parts)\n  },\n};\n\n// ---- the parser ---------------------------------------------------------------------\n// Contents, in the order of the file:\n//   1. Words and numbers   `hai mươi tư`, `nhất lẻ một`, `XIV` as numbers\n//   2. Lines into tokens   a line as a string of classes (number, chapter word, bracket, ...)\n//   3. Headings            the shapes a heading takes, and the candidate found at each line\n//   4. The path            the best way through the candidates, and the checks around it\n//   5. Drafts              the path as chapters, or pages, or a series, and the title page\n//   6. extractChapters     the whole, in a few lines\n//\n// The headings of a book are the lines whose numbers run in sequence: 1, 2, 3 ... A line\n// that merely looks like a heading (`Một giờ sau...`, `Kết quả là...`) has a number that\n// fits nowhere in that sequence, so the sequence is what is looked for, not the look.\n//\n//   findCandidates    every line that could be a heading, read into a node (number,\n//                       marker words, book, title) with how much its shape speaks for it\n//   chooseHeadings    the best path through the nodes: a number followed by the next one\n//                       scores, a repeat close by is the same heading, a jump costs, a\n//                       book or an extra (phiên ngoại) may start the numbers over\n//   buildChapters     the chosen nodes become chapters, with their title and book\n//\n// A shape (`【N】`, `Chương N: T`, `(N) T`) that mostly lands on the path is trusted\n// more on a second look, so a book's own style outweighs the one-off lines.\n\n// ==== 1. Words and numbers ===================================================================\nconst WORD_DIGITS = { một: 1, mốt: 1, hai: 2, ba: 3, bốn: 4, tư: 4, năm: 5, lăm: 5, sáu: 6, bảy: 7, tám: 8, chín: 9 };\nconst SINO_DIGITS = { nhất: 1, nhị: 2, tam: 3, tứ: 4, ngũ: 5, lục: 6, thất: 7, bát: 8, cửu: 9 };\n// the units that may follow `mươi`: `hai mươi tư` is 24, `ba mươi mốt` 31 (`mốt` and `lăm` are\n// the forms a unit takes there)\nconst TENS_UNITS = ['mốt', 'hai', 'ba', 'bốn', 'tư', 'lăm', 'sáu', 'bảy', 'tám', 'chín'];\n\n// the longest number the words at `i` read as: { value, length } in words, or null\nfunction readNumberWords(words, i) {\n  let w = (k) => words[i + k];\n  let best = null;\n  let take = (value, length) => {\n    if(!best || length > best.length) best = { value, length };\n  };\n  // 100-199 read out digit by digit: `nhất lẻ loi` is 100, `nhất lẻ một` 101,\n  // `nhất nhất linh` 110. `lẻ loi` stands for two zeros, `lẻ` and `linh` for one\n  if(w(0) === 'nhất') {\n    let digit = (x) => (x === 'lẻ' || x === 'linh') ? 0 : (SINO_DIGITS[x] ?? WORD_DIGITS[x]);\n    if(w(1) === 'lẻ' && w(2) === 'loi') take(100, 3);\n    if(['lẻ', 'linh', ...Object.keys(SINO_DIGITS)].includes(w(1)) && digit(w(2)) != null) {\n      take(100 + 10 * digit(w(1)) + digit(w(2)), 3);\n    }\n  }\n  if(w(0) === 'mười') {\n    take(10, 1);\n    if(w(1) in WORD_DIGITS && w(1) !== 'tư') take(10 + WORD_DIGITS[w(1)], 2);\n  }\n  if(w(0) in WORD_DIGITS) {\n    take(WORD_DIGITS[w(0)], 1);\n    if(w(1) === 'mươi') {\n      let tens = 10 * WORD_DIGITS[w(0)];\n      take(tens, 2);\n      if(TENS_UNITS.includes(w(2))) take(tens + WORD_DIGITS[w(2)], 3);\n    }\n  }\n  let sino = (k) => SINO_DIGITS[w(k)];\n  if(w(0) === 'thập') {\n    take(10, 1);\n    if(sino(1)) take(10 + sino(1), 2);\n  }\n  if(sino(0)) {\n    take(sino(0), 1);\n    if(w(1) === 'thập') {\n      take(sino(0) * 10, 2);\n      if(sino(2)) take(sino(0) * 10 + sino(2), 3);\n    }\n  }\n  return best;\n}\n\nconst ROMAN_VALUES = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };\nfunction readRoman(word) {\n  if(!/^[IVXLCDM]+$/.test(word)) return null;\n  let total = 0;\n  for(let k = 0; k < word.length; k++) {\n    let [a, b] = [ROMAN_VALUES[word[k]], ROMAN_VALUES[word[k + 1]] ?? 0];\n    total += a < b ? -a : a;\n  }\n  return total > 0 && total < 4000 ? total : null;\n}\n\n// ==== 2. Lines into tokens ===================================================================\n// A token's class is one letter:\n//   N number   E end word (kết, cuối)   c chapter word   p phiên ngoại / ngoại truyện\n//   b book word   t thứ / đệ   f tiết   h thượng / trung / hạ\n//   n the book's own name   L opening bracket   R closing bracket   S other mark   x any word\nconst CHAPTER_WORDS = { chương: 'Chương', hồi: 'Hồi', thiên: 'Thiên' };\nconst BOOK_WORDS = { quyển: 'Quyển', tập: 'Tập', bộ: 'Bộ', cuốn: 'Cuốn', quý: 'Quý' };\nconst HALF_WORDS = { thượng: 1, trung: 2, hạ: 3 };\n// the words that are a class of token by themselves (a class and what it carries), and the\n// phrases of two words that are\nconst KNOWN_WORDS = new Map([\n  ...Object.entries(CHAPTER_WORDS).map(([word, shown]) => [word, ['c', { word: shown }]]),\n  ...Object.entries(BOOK_WORDS).map(([word, shown]) => [word, ['b', { word: shown }]]),\n  ...Object.entries(HALF_WORDS).map(([word, value]) => [word, ['h', { value, word }]]),\n  ['thứ', ['t', {}]], ['đệ', ['t', {}]], ['tiết', ['f', {}]],\n]);\nconst KNOWN_PHRASES = [['phiên ngoại', 'p', 'Phiên ngoại'], ['ngoại truyện', 'p', 'Ngoại truyện'], ['giai đoạn', 'b', 'Giai đoạn']];\n\n// the token a word or a phrase of two begins, as [class, what it carries, its length], or null\nfunction readKnownWord(word, lower, pos) {\n  for(let [phrase, cls, shown] of KNOWN_PHRASES) {\n    if(lower.startsWith(phrase, pos)) return [cls, { word: shown }, phrase.length];\n  }\n  let known = KNOWN_WORDS.get(word);\n  return known && [...known, word.length];\n}\n\nconst OPENERS = '【[(（《“\"«';\nconst CLOSERS = '】])）》”\"»';\n\nfunction lexLine(line, lower, names) {\n  let tokens = [];\n  let pos = 0;\n  while(pos < line.length && tokens.length < 18) {\n    let ch = line[pos];\n    if(/\\s/.test(ch)) { pos++; continue; }\n    let add = (cls, end, extra = {}) => {\n      tokens.push({ cls, s: pos, e: end, text: line.slice(pos, end), ...extra });\n      pos = end;\n    };\n    let name = names.find(n => lower.startsWith(n, pos) && !/\\p{L}/u.test(lower[pos + n.length] ?? ''));\n    if(name) { add('n', pos + name.length); continue; }\n    if(OPENERS.includes(ch)) { add('L', pos + 1); continue; }\n    if(CLOSERS.includes(ch)) { add('R', pos + 1); continue; }\n    if(/\\d/.test(ch)) {\n      let m = /^\\d+(?:\\.\\d+)?/.exec(line.slice(pos));\n      let [major, minor] = m[0].split('.');\n      // `0.05` is a fraction (a countdown, a price), not chapter 5 of a book 0\n      if(minor != null && Number(major) === 0) { add('x', pos + m[0].length); continue; }\n      // `3.40` is chapter 40 of book 3\n      add('N', pos + m[0].length, { value: Number(minor ?? major), book: minor == null ? null : Number(major), digits: true });\n      continue;\n    }\n    let word = /^\\p{L}+/u.exec(line.slice(pos));\n    if(!word) { add('S', pos + 1); continue; }\n    word = word[0];\n    // the words that follow, for the numbers that take several\n    let words = [lower.slice(pos, pos + word.length)];\n    let ahead = pos + word.length;\n    for(let k = 0; k < 4; k++) {\n      let next = /^ \\p{L}+/u.exec(line.slice(ahead));\n      if(!next) break;\n      words.push(lower.slice(ahead + 1, ahead + next[0].length));\n      ahead += next[0].length;\n    }\n    let number = readNumberWords(words, 0);\n    if(number) {\n      // the end of the last word it read\n      let end = pos;\n      for(let k = 0; k < number.length; k++) end += (k ? 1 : 0) + words[k].length;\n      add('N', end, { value: number.value, sino: words[0] in SINO_DIGITS || words[0] === 'thập' });\n      continue;\n    }\n    let roman = readRoman(word);\n    let lowered = words[0];\n    let end = pos + word.length;\n    let known = readKnownWord(lowered, lower, pos);\n    if(roman != null && word.length <= 7) add('N', end, { value: roman, roman: true });\n    else if(known) add(known[0], pos + known[2], known[1]);\n    else if(lowered === 'kết' || lowered === 'cuối') {\n      // `Chương kết` ends the book; `Kết quả là` and `Cuối cùng` are only sentences\n      let after = /^\\s*(\\S)/.exec(line.slice(end));\n      let lone = !after || /[^\\p{L}\\p{N}]/u.test(after[1]);\n      add(lone ? 'E' : 'x', end, { word: lowered });\n    }\n    else add('x', end);\n  }\n  return tokens;\n}\n\n// ==== 3. Headings ============================================================================\n// A heading found in the text, a candidate for a chapter. Every one has all of these:\n//   kind      'chap' | 'book' | 'extrahead' | 'half' | 'interlude'\n//   base      how much it speaks for itself, 0-10, before the book's own style weighs in\n//   where     index (in the text), start (in its line), ord (the rank of its line among the\n//             lines that have anything in them)\n//   said      text (the heading as written), title (what follows), rest (the line after it),\n//             whole (nothing follows)\n//   shape     what it looks like, for the trust a book gives that look\n//   chapter   n, span (the last of a run: `7-10`), end / endWord (`kết`, `cuối`), chapType,\n//             extra (phiên ngoại), and a part of it: half (1 thượng, 2 trung, 3 hạ, or a\n//             number), halfText, halfBracketed (written `(hạ)`), halfNum, halfType\n//   book      bookNum, bookType, and bookName for a book that names itself and has no\n//             number (`Tên sách: Ngoại truyện: Ba cái tiểu xử nữ`)\n//   outer     the section it is a part of: `Chương 2: Tiên tử chi ân | thứ 3 hồi ...`\n//   inline    found in the middle of a line, not at its start\nconst HEADING_DEFAULTS = {\n  kind: 'chap', base: 0, index: 0, start: 0, ord: 0, text: '', title: '', rest: '', whole: false, shape: '',\n  n: null, span: null, end: false, endWord: null, chapType: null, extra: false,\n  half: null, halfText: null, halfBracketed: false, halfNum: null, halfType: null,\n  bookNum: null, bookType: null, bookName: null, outer: null, inline: false,\n};\n\nfunction heading(fields) {\n  for(let key in fields) if(!(key in HEADING_DEFAULTS)) throw new Error(`a heading has no ${key}`);\n  return { ...HEADING_DEFAULTS, ...fields };\n}\n\n// the shapes a heading can take, over the token classes. The first that fits wins\nconst DECOR = '[LS]*';\nconst NAME_PART = '(?:nR?S?)?';\nconst BOOK_PART = '(?:(?<bm>b)t?(?<bn>N)|(?<bt>t)(?<bn2>N)(?<bm2>b)|(?<bn3>N)(?<bm3>b))R?S?';\n// the book after the chapter, in brackets: `Thứ 1 chương (bộ 02) chi du thuyền xuân sắc`\nconst BOOK_AFTER = '(?:L(?<bm4>b)t?(?<bn4>N)R)?';\nconst HEADING_RULES = [\n  // Chương 5 | Chương kết | Thứ 5 chương | Ba mươi tám chương | Quyển 2 Chương 7 | 【NAME】 Chương 5\n  // | Thứ 1 chương (bộ 02)\n  { kind: 'chap', base: 9, re: `^${DECOR}${NAME_PART}${DECOR}(?:${BOOK_PART}[xc]{0,10})?${DECOR}(?:(?<pm0>p)?(?<cm>[cp])(?<cn>[NE])|(?<tt>t)?(?<cn2>[NE])(?<cm2>c))${BOOK_AFTER}` },\n  // Phiên ngoại: 【1】 title\n  { kind: 'chap', base: 9, re: `^${DECOR}(?<cm>p)[LS]+(?<cn>N)R?` },\n  // Thứ 7-10 chương: several chapters under one heading\n  { kind: 'chap', base: 9, re: `^${DECOR}(?<tt>t)?(?<cn>N)S(?<cn3>N)(?<cm2>c)` },\n  // 【NAME】9 | NAME #3 | NAME (5) | 《NAME》2\n  { kind: 'chap', base: 7, re: `^${DECOR}nR?S?${DECOR}(?<cn>N)R?` },\n  // Quyển thứ ba 3: the chapter's number follows its book's\n  { kind: 'chap', base: 7, re: `^${DECOR}${NAME_PART}${DECOR}${BOOK_PART}${DECOR}(?<cn>N)` },\n  // Quyển thứ hai | Bộ 2 | Thứ 4 cuốn\n  { kind: 'book', base: 6, re: `^${DECOR}${NAME_PART}${DECOR}${BOOK_PART}` },\n  // Kỳ Bạch Tuyết phiên ngoại\n  { kind: 'extrahead', base: 5, re: '^[LS]*x{1,8}(?<pm>p)$' },\n  // Tiết thứ hai | Thứ 1 tiết\n  { kind: 'half', base: 5, re: '^[LS]*(?:f t?(?<hn>N)|t(?<hn2>N)f)' },\n  // Nhất, trong sương mù đường về: a Sino-Vietnamese ordinal and a comma\n  { kind: 'chap', base: 5, weakTitled: 4.5, sino: true, re: '^(?<cn>N)(?<sep>S)' },\n  // (5) | 【nhất】 | 5. | 22) | 2,\n  { kind: 'chap', base: 5, weakTitled: 3, re: '^L?(?<cn>N)R?' },\n  // Phòng tắm thiên Chương 1: a few words, then the chapter\n  { kind: 'chap', base: 6, re: '^[LS]*(?<pre>[xc]{1,6})(?<cm>c)(?<cn>N)(?![xNE])' },\n  // Kỳ Bạch Tuyết (nhất) | Kiều thê chuyện xưa (nhất) | Quy tắc quái đàm — mới vào học viện (1)\n  { kind: 'chap', base: 4, re: '^[LS]*(?<ph>[xS]{1,16})L(?<cn>N)R' },\n  // (hạ)\n  { kind: 'half', base: 5, re: '^(?<hl>L)?(?<hm>h)R?$' },\n].map(rule => ({ ...rule, re: new RegExp(rule.re, 'd') }));\n\n// the title a line carries after its heading: no separator left in front, no bracket behind\nfunction cleanTitle(rest) {\n  let title = rest.replace(/^[\\s:：.,\\-—–/|)\\]】”\"»*#!]+/u, '').trimEnd();\n  // a closing bracket with nothing opened before it goes; one that closes a tag stays\n  while(/[】\\]”\"»]$/u.test(title) && (title.match(/[】\\]”\"»]/gu) || []).length > (title.match(/[【\\[“«]/gu) || []).length) {\n    title = title.slice(0, -1).trimEnd();\n  }\n  return title;\n}\n\n// how much a line reads like a sentence of the story and not like a title\nfunction proseCost(rest) {\n  let t = TUNING.prose;\n  let cost = 0;\n  let commas = (rest.match(/[,;]/g) || []).length;\n  if(rest.length > t.longerThan) cost += t.long;\n  if(commas >= t.commas) cost += t.manyCommas;\n  else if(commas === 1 && rest.length > t.oneCommaOver) cost += t.oneComma;\n  if(rest.length > t.sentenceOver && /[.!?…\"”]$/.test(rest)) cost += t.sentence;\n  return cost;\n}\n\nfunction leadingTitle(m, tokens, line, rest) {\n  let span = m.indices.groups.pre ?? m.indices.groups.ph;\n  if(!span) return null;\n  let words = tokens.slice(span[0], span[1]);\n  let dash = m.indices.groups.ph ? words.findLastIndex(t => t.cls === 'S') : -1;\n  let from = words[dash + 1] ?? words[0];\n  return cleanTitle([line.slice(from.s, words.at(-1).e), cleanTitle(rest)].filter(Boolean).join(' '));\n}\n\n// what a matched rule says: the chapter's number, its markers, the book and half it names\nfunction readRoles(rule, at) {\n  let roles = {};\n  let number = at('cn') ?? at('cn2');\n  let marker = at('cm') ?? at('cm2');\n  if(rule.kind === 'chap') {\n    if(number.cls === 'E') Object.assign(roles, { end: true, endWord: number.word });\n    else {\n      roles.n = number.value;\n      if(number.book != null) roles.bookNum = number.book;\n    }\n    if(marker) {\n      roles.chapType = marker.word ?? marker.text;\n      if(marker.cls === 'p' || at('pm0')) {\n        roles.extra = true;\n        roles.chapType = (at('pm0') ?? marker).word;\n      }\n    }\n  }\n  if(at('cn3')) roles.span = at('cn3').value;\n  let bookNumber = at('bn') ?? at('bn2') ?? at('bn3') ?? at('bn4');\n  if(bookNumber) {\n    roles.bookNum = bookNumber.value;\n    roles.bookType = (at('bm') ?? at('bm2') ?? at('bm3') ?? at('bm4')).word;\n  }\n  if(rule.kind === 'extrahead') roles.extra = true;\n  if(rule.kind === 'half') {\n    let numbered = at('hn') ?? at('hn2');\n    if(numbered) Object.assign(roles, { halfNum: numbered.value, halfType: 'tiết', half: numbered.value });\n    else Object.assign(roles, { half: at('hm').value, halfText: at('hm').word, halfBracketed: !!at('hl') });\n  }\n  return { roles, number, marker };\n}\n\n// how much the heading speaks for itself, 0-10, before the book's own style weighs in\nfunction baseOf(rule, { roles, number, marker }, { title, rest, whole, hasRoman, hasPhrase, titled }) {\n  let base = rule.base;\n  // a bare number with a title after it is the weakest shape of all; in digits less so\n  if(rule.weakTitled != null && !whole) base = rule.weakTitled + (roles.bookNum != null ? TUNING.base.decimal : 0) + (number?.digits ? TUNING.base.digits : 0);\n  // `3.07` is hardly ever anything but a chapter\n  else if(number?.book != null) base += TUNING.base.decimal;\n  if(marker?.cls === 'c' && marker.word === 'Thiên') base += TUNING.base.thien;\n  if(hasPhrase && whole) base += TUNING.base.phraseAlone;\n  // a book heading must stand on its own line to be believed, or be followed by a colon and\n  // a short title (`Quyển thứ nhất: Kinh thành phong vân`): `Hai bộ ngực...` is prose\n  // (`(quyển thứ nhất: Hoàn!)` ends a volume, it does not open one; a phase is only a heading alone)\n  let ending = /(?:^|\\s)(?:hoàn|xong|kết thúc)(?:$|[\\s.!)])/iu.test(title);\n  let bookMax = TUNING.base.bookTitleMax;\n  if(rule.kind === 'book') base += whole || (titled && title.length <= bookMax && !ending) ? TUNING.base.bookAlone : (title.length > bookMax || ending || roles.bookType === 'Giai đoạn' ? TUNING.base.bookProse : 0);\n  // a heading with its marker (`Chương 10: ...`) is still one when the paragraph runs on\n  // behind it on the same line; only a bare number is made doubtful by that\n  base -= marker ? Math.min(proseCost(title), TUNING.base.markerProseMax) : proseCost(title);\n  // the title page: `【NAME】1-74 tác giả: ...`\n  if(/tác giả/.test(rest) || /^\\s*[-–~]\\s*\\d/.test(rest)) base += TUNING.base.titlePage;\n  if(hasRoman) base += TUNING.base.roman;\n  return base;\n}\n\n// the classes up to the heading's end, runs of words as one. A number written in\n// digits is told from one in words: sentences begin with `Một` by the hundred and with\n// `192` almost never, and `3.07` is a chapter\nfunction shapeOf(tokens, length, whole) {\n  let spelled = tokens.slice(0, length).map(t => t.cls !== 'N' ? t.cls : t.book != null ? 'D' : t.digits ? '#' : 'N').join('');\n  return spelled.replace(/x+/g, 'X') + (whole ? '' : 'T');\n}\n\n// `Chính văn` (the main text, as against the extras) labels a heading and is no part of it\nconst SECTION_LABEL = /^\\s*chính văn\\s+(?=\\S)/iu;\n\n// a chapter in parts: `Chương 27: (thượng)`, `Chương 44: (nhất)`, or a title that ends in\n// `(hạ)`. The parts are shown one by one, each as the part of its chapter\nfunction partOf(title) {\n  let alone = /^\\(\\s*(\\p{L}+(?: \\p{L}+)*)\\s*\\)$/u.exec(title);\n  if(alone) {\n    let value = valueOfPart(alone[1].toLowerCase());\n    if(value != null) return { half: value, halfText: alone[1].toLowerCase(), title: '' };\n  }\n  let ending = /\\s*\\((thượng|trung|hạ)\\)$/iu.exec(title);\n  if(ending) return { half: HALF_WORDS[ending[1].toLowerCase()], halfText: ending[1].toLowerCase(), title };\n  return null;\n}\n\n// the number a part is written as: `thượng` is 1, `hạ` 3, `nhất` 1, `hai mươi` 20; null if it is no number\nfunction valueOfPart(word) {\n  if(word in HALF_WORDS) return HALF_WORDS[word];\n  let words = word.split(' ');\n  let number = readNumberWords(words, 0);\n  return number?.length === words.length ? number.value : null;\n}\n\n// `Tên sách: Ngoại truyện: Ba cái tiểu xử nữ`: the title of one of the books a file holds\nconst BOOK_TITLE = /^\\s*tên sách\\s*[:：]\\s*(\\S.*?)\\s*$/iu;\n\nfunction readHeading(line, lower, names) {\n  if(line.length > 400) return null;\n  let named = BOOK_TITLE.exec(line);\n  if(named) {\n    return heading({ kind: 'book', base: TUNING.base.bookTitle, bookName: named[1], title: named[1], text: line.trim(), start: line.search(/\\S/), shape: 'named' });\n  }\n  let label = SECTION_LABEL.exec(line);\n  if(label rest, title: cleanTitle(rest).slice(0, TUNING.base.inlineTitleMax),\n      shape: 'inline', index: lineStart + m.index, ord,\n    }));\n  }\n  return found;\n}\n\nfunction findCandidates(text, name) {\n  let lowerName = name.toLowerCase().normalize();\n  let names = [...new Set([lowerName, lowerName.replace('hệ liệt', '').trim()])].filter(Boolean)\n    .sort((a, z) => z.length - a.length);\n  let nodes = [];\n  let ord = 0;\n  let lineStart = 0;\n  while(lineStart <= text.length) {\n    let lineEnd = text.indexOf('\\n', lineStart);\n    if(lineEnd === -1) lineEnd = text.length;\n    let line = text.slice(lineStart, lineEnd);\n    if(/\\S/.test(line)) {\n      ord++;\n      let lower = line.toLowerCase();\n      let node = lower.length === line.length ? readHeading(line, lower, names) : null;\n      if(node) nodes.push(heading({ ...node, index: lineStart + node.start, ord }));\n      let opensWithHeading = node && node.base >= TUNING.path.breakMinBase;\n      if(!opensWithHeading && line.length < 4000) nodes.push(...inlineHeadings(line, lineStart, ord));\n    }\n    lineStart = lineEnd + 1;\n  }\n  // one title line is the title page's own: it takes two for the file to hold books\n  if(nodes.filter(node => node.bookName).length < 2) nodes = nodes.filter(node => !node.bookName);\n  return nodes.sort((a, z) => a.index - z.index || a.ord - z.ord);\n}\n\n// ==== 4. The path ============================================================================\n// What a path has reached by a node, and all the paths need to go on from it:\n//   book    the book it is in, 0 when no book has been told apart\n//   word    what the last book named was called (`Quyển`, `Bộ`, `Giai đoạn`), if any was\n//   kind    the word of a book that numbers apart from the others (`Bộ 02` after the `Quyển`s),\n//           null while the books are of the one kind\n//   name    the name of a book that names itself and has no number (`Tên sách: ...`), until\n//           a chapter numbers it (`Thứ 1 ch ach calls `go(from, value, reached, joins)` for a way it\n  // sees, and `begin(value, reached)` for a path that could start at the node itself\n  let into = {\n    chap(i, ways) {\n      goingOn(i, ways);\n      afterBookHeading(i, ways);\n      intoNewBook(i, ways);\n      breakingOff(i, ways);\n      startingHere(i, ways);\n    },\n    // the last chapter: a repeat of the heading just before it, or the one after it\n    end(i, { go }) {\n      let node = nodes[i];\n      let recent = [];\n      for(let j = i - 1; j >= 0 && recent.length < TUNING.path.endLookback; j--) if(score[j] > -Infinity) recent.push(j);\n      for(let j of recent) {\n        let s = state[j];\n        if(s.ended || s.n == null || s.extra !== !!node.extra) continue;\n        if(apart(i, j) <= TUNING.path.closeLines) go(j, TUNING.reward.repeat + 1, { ...s, ended: true }, true);\n        else if(s.n >= TUNING.path.endMin) go(j, TUNING.reward.end, { ...s, n: s.n + 1, ended: true });\n      }\n    },\n    book(i, { go, begin }) {\n      let node = nodes[i];\n      let b = node.bookNum ?? 0;\n      let extra = node.kind === 'extrahead' || !!node.extra;\n      // a book that names itself and has no number is the next one, after whatever came\n      if(node.bookName && node.bookNum == null) {\n        for(let j of bestByKey.values()) go(j, 0, reached(node, { book: state[j].book + 1, carry: state[j].n ?? 0, n: null }));\n        begin(TUNING.path.startAlone, reached(node, { book: 1, n: null }), books.length > 0);\n        return;\n      }\n      for(let j of bestByKey.values()) {\n        let s = state[j];\n        // the next book, or one further on when a few were never named; or a book of another\n        // kind, which numbers apart from the rest (`Bộ 02` after `Quyển 13`)\n        let next = b > s.book || (b <= 2 && s.book === 0);\n        let ofAnotherKind = !extra && !next && s.word != null && node.bookType != null && s.word !== node.bookType;\n        let follows = extra ? !s.extra : (!s.extr      : node.kind === 'extrahead' ? 'book' : node.kind;\n    into[way]?.(i, { go, begin });\n    if(best.value === -Infinity) continue;\n    score[i] = best.value + prior;\n    prev[i] = best.from;\n    joined[i] = best.joined;\n    state[i] = best.as;\n    // a piece in front of a book's first chapter (its preface, `Thứ 0 chương tự`) opens the\n    // book as its heading does\n    let opensBook = node.kind === 'interlude' && state[i].n == null;\n    if(node.kind === 'book' || node.kind === 'extrahead' || opensBook) books.push(i);\n    else remember(i);\n    if(top < 0 || score[i] > score[top]) top = i;\n  }\n\n  let path = [];\n  for(let i = top; i >= 0; i = prev[i]) path.push({ i, joined: joined[i], state: state[i] });\n  return path.reverse();\n}\n\n// A heading with a single line before the next is not a chapter of a book whose chapters\n// run to dozens of lines: a list in the story (`Hồi 1: ...`, `Hồi 2: ...`) passes\n// for a short chain the path is glad to take. The nodes of such a section are left out\nfunction tinySections(nodes, path) {\n  let chapters = path.filter(({ i }) => nodes[i].kind === 'chap');\n  let lengths = chapters.slice(1).map(({ i }, k) => nodes[i].ord - nodes[chapters[k].i].ord).sort((a, z) => a - z);\n  let typical = lengths[Math.floor(lengths.length / 2)] ?? 0;\n  let tiny = new Set();\n  // a book of one-paragraph chapters has nothing to tell a list from\n  if(typical < TUNING.tiny.typicalAtLeast) return tiny;\n  chapters.forEach(({ i }, k) => {\n    let next = chapters[k + 1];\n    if(next && !next.joined && nodes[next.i].ord - nodes[i].ord <= TUNING.tiny.lines) tiny.add(i);\n  });\n  return tiny;\n}\n\n// A contents list at the head of a book: a few headings close together (some with a few\n// lines of notes under them), after which the book starts its numbers over and goes\n// through them again. The entries are part of the title page, not chapters. Told by four\n// things together: there are several entries (two sections in front of a.i - z.i);\n}\n\n// ==== 5. Drafts ==============================================================================\nconst END_PHRASE = /^(chương\\s+)?(kết|cuối)$/i;\n\n// a title the heading itself carries, the plainest one when several headings stood together\nfunction pickTitle(members) {\n  let titles = members.map(m => m.title).filter(t => t && !END_PHRASE.test(t));\n  titles.sort((a, z) => proseCost(a) - proseCost(z) || z.length - a.length);\n  // a paragraph that runs on behind the heading is not part of its title\n  let title = titles[0];\n  return title?.length > TUNING.drafts.titleMax ? `${title.slice(0, TUNING.drafts.titleMax).replace(/\\s+\\S*$/, '')}…` : title;\n}\n\nfunction buildChapters(nodes, path) {\n  let clusters = [];\n  let opening;   // where the book heading in front of the next chapter begins\n  for(let { i, joined, state } of path) {\n    let node = nodes[i];\n    if(node.kind === 'book' || node.kind === 'extrahead') {\n      opening ??= node.index;\n      continue;\n    }\n    if(joined && clusters.length) {\n      clusters.at(-1).members.push(node);\n      clusters.at(-1).state = state;\n      continue;\n    }\n    clusters.push({ members: [node], state, index: Math.min(opening ?? Infinity, node.index) });\n    opening = undefined;\n  }\n  // a book is `Quyển` or `Bộ` throughout, whichever the books' headings say most often, or\n  // else the chapters that name their book (`Thứ 1 chương (bộ 02)`)\n  let mostSaid = (words) => {\n    let types = {};\n    for(let word of words) if(word) types[word] = (types[word] ?? 0) + 1;\n    return Object.keys(types).sort((a, z) => types[z] - types[a])[0];\n  };\n  let bookWord = mostSaid(path.map(({ i }) => nodes[i].kind === 'book' ? nodes[i].bookType : null))\n    ?? mostSaid(path.map(({ i }) => nodes[i].bookNum != null ? nodes[i].bookType : null)) ?? 'Quyển';\n  let drafts = [];\n  let section;    // the section whose parts are being listed\n  for(let { members, state, index } of clusters) {\n    let f :root,
:root[data-paper-size=sm] { --paper-width: 90ex; }
:root[data-paper-size=md] { --paper-width: 120ex; }
:root[data-paper-size=lg] { --paper-width: 160ex; }
:root[data-paper-size=xl] { --paper-width: 100%; }

* {
  font-family: inherit;
}

*::selection {
  background-color: var(--selection-bg);
}

/** layout **/
body {
  display: grid;
  grid-template-columns: minmax(var(--nav-width), 1fr) minmax(auto, calc(var(--paper-width) + 2*var(--paper-padding))) auto;
}

/** global **/
html,
body {
  font: var(--reading-font-weight, 400) var(--reading-font-size, 18pt)/1.4 var(--reading-font, Reader);
  color: var(--body-font-color);
  background: var(--body-background-color);
  font-variant-numeric: oldstyle-nums tabular-nums slashed-zero;
  -webkit-font-smoothing: var(--body-font-smoothing, normal);
}
a {
  color: var(--link-color);
}

nav,
aside,
.table,
dialog,
#add-name {
  font-family: var(--ui-font, Reader);
  font-size: var(--ui-font-size, 18pt);
  font-weight: var(--ui-font-weight, 400);
}

dialog {
  background-color: var(--dialog-background-color, var(--body-background-color));
  color: var(--body-font-color);
  box-shadow: 0 10px 20px rgba(0,0,0,.2);
  border: 1px solid var(--horizontal-line-color);
}

@property --scroll-progress {
  syntax: '<percentage>';
  initial-value: 100%;
  inherits: false;
}
@keyframes scrollProgress {
  0% {
    --scroll-progress: 0%;
  }
  100% {
    --scroll-progress: 100%;
  }
}

/** nav **/
nav {
  height: 100vh;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  position: sticky;
  top: 0;
  padding: calc(var(--gap) * 0.75);
  /* the chapter list reads a size down from the rest of the chrome, and `rem` would
     read it down from the book instead */
  font-size: calc(var(--ui-font-size, 18pt) * 0.875);
  line-height: 1.2;
  ol {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    align-items: start;
    li {
      max-width: 100%;
      &:not(.active) {
        white-space: nowrap;
      }
      padding-top: 0.1ex;
      padding-bottom: 0.1ex;
      padding-left: calc(var(--gap) * 0.25);
      padding-right: calc(var(--gap) * 0.25);
      &.active {
        background: var(--body-font-color);
        outline: calc(var(--gap) * 0.15) solid var(--body-font-color);
        border-radius: 0.5ex;
        color: var(--body-background-color);
        a {
          pointer-events: none;
          color: inherit;
        }
      }
      a {
        display: block;
        /* the link reaches out over its item's padding and half the gap on either side,
           so there is nowhere between two entries that a click falls through; the item
           (and its highlight) stays the size it was */
        margin: calc(-0.1ex - 0.25em) calc(var(--gap) * -0.25);
        padding: calc(0.1ex + 0.25em) calc(var(--gap) * 0.25);
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--body-font-color);
        &:hover {
          color: var(--link-color);
        }
      }
      &:first-child a {
        font-weight: bold;
      }
      /* one part of the chapter named above it, with a guide down its left */
      &.part {
        position: relative;
        margin-left: 1em;
        max-width: calc(100% - 1em);
        &::before {
          content: '';
          position: absolute;
          /* under the start of the chapter's name, and over half the gap on either side,
             so the guides of its parts join into one line */
          left: calc(var(--gap) * 0.25 - 1em);
          top: -0.25em;
          bottom: -0.25em;
          border-left: 4px solid var(--body-font-color);
          opacity: 0.15;
          pointer-events: none;
        }
      }
      /* a heading for the chapters below it, not a link */
      &.book {
        font-size: 0.75em;
        opacity: 0.6;
        padding-top: calc(var(--gap) * 0.5);
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  }
}

/** aside **/
aside {
  position: sticky;
  top: 0;
  height: 100vh;
}
aside a,
aside button {
  appearance: none;
  background: var(--paper-background-color);
  color: var(--body-font-color);
  /* the ua stylesheet pins a button to 13.3px Arial, and `* { font-family: inherit }`
     only ever took back the family half of that. The labels on the rail read well
     under the rest of the chrome, and at 0.6 they land where that 13.3px had them */
  font-size: 0.6em;
  font-weight: inherit;
  outline: 1px solid var(--horizontal-line-color);
  width: 100%;
  min-width: 24px;
  aspect-ratio: 1;
  display: grid;
  place-content: center;
  border-radius: 50%;
  cursor: pointer;
  padding: calc(var(--gap) * .25)
}
aside > div {
  padding-top: calc(var(--gap) * .75);
  padding-bottom: calc(var(--gap) * .75);
  padding-left: calc(var(--gap) * .75);
  padding-right: calc(var(--gap) * .75);
  display: flex;
  flex-direction: column;
  row-gap: calc(var(--gap) * .5);
}
aside > div + div {
  position: relative;
}
aside > div + div::before {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate3d(-50%, 0, 0);
  content: '';
  display: block;
  width: calc(var(--gap) * 2);
  height: 1px;
  background: var(--horizontal-line-color);
  opacity: 0.5;
}
aside .colors button {
  border-radius: 2em;
  &::before {
    content: var(--checkmark);
    font-size: .7em;
  }
  @media (prefers-color-scheme:light) {
    &.checked\:light {
      --checkmark: '✔';
    }
  }
  @media (prefers-color-scheme:dark) {
    &.checked\:dark {
      --checkmark: '✔';
    }
  }
}
aside a.close {
  position: relative;
  box-shadow: 0 3px 6px rgba(0, 0, 0, .2);
  &::before,
  &::after {
    content: '';
    display: block;
    width: 50%;
    height: 1px;
    transform: translate3d(-50%, -50%, 0) rotateZ(var(--rotate, 45deg));
    position: absolute;
    top: 50%;
    left: 50%;
    background: currentColor;
  }
  &::after {
    --rotate: -45deg;
  }

  outline: 0;
  background: radial-gradient(closest-side, var(--paper-background-color) 79%, transparent 80% 100%), conic-gradient(var(--link-color) var(--scroll-progress, 0%), var(--horizontal-line-color) 0);
  animation: scrollProgress auto linear;
  animation-timeline: scroll();
}

aside button {
  border-radius: 1em;
  corner-shape: squircle;
  outline-width: 0;

  &.selected {
    font-weight: bold;
  }

  &.refresh::after {
    content: 'ℝ';
  }
  &.zen::after {
    content: 'ℤ';
  }
  &.names-editor::after {
    content: 'ℕ';
  }
  &.font::after {
    content: '𝔽';
  }
}

/** main **/
main {
  display: flex;
  background: var(--paper-background-color);
  padding: 1rem 3rem;
  outline: 1px solid var(--paper-outline-color, transparent);
  box-shadow: 0px 6px 12px 3px var(--paper-shadow-color, transparent);
  article {
    flex: 1;
    text-indent: 3ch;
    max-width: var(--paper-width, 90ex);
    margin: 0 auto;
    p:first-child {
      line-height: 1.2;
      font-size: 1.5rem;
      font-weight: bold;
    }
    hr {
      background: var(--horizontal-line-color);
    }

    ::highlight(name) {
      color: var(--link-color);
    }
  }
}

/** table **/
.table {
  display: grid;
  grid-template-columns: 1fr auto auto auto auto;
  row-gap: var(--gap);
  column-gap: calc(var(--gap) * 2);
  padding: 0 var(--gap) var(--gap);
  background: var(--paper-background-color);
  box-shadow: 0px 6px 12px 3px var(--paper-shadow-color);
  outline: 1px solid var(--paper-outline-color);
  line-height: 1.2;
  align-self: stretch;
  align-content: start;
}
.table .name {
  font-weight: bold;
}
.table .th {
  white-space: nowrap;
  padding: calc(var(--gap)/2) 0;
  position: sticky;
  top: 0;
  background: var(--paper-background-color);
}
.table .th::before {
  content: '';
  display: block;
  border-bottom: 1px solid var(--horizontal-line-color);
  width: calc(100% + 1ex);
  height: calc(2ex + 2px);
  box-shadow: 0 calc(1ex - 5px) 1.4ex -1ex rgba(0, 0, 0, .5);
  position: absolute;
  bottom: -1px;
  left: calc(-1ex / 2);
}
.table .th span {
  display: inline-block;
  position: relative;
}
.table .th span::after {
  position: absolute;
  bottom: calc(1ex/4);
  right: -1.8ex;
  color: var(--body-font-color);
}
.table .th[data-sort=asc] span::after { content: '↑'; }
.table .th[data-sort=desc] span::after { content: '↓'; }
.table .desc { display: block; }
.table .delete { color: inherit; }
.table .delete:hover { color: var(--link-color); }

/** zen mode **/
[data-zen=true] nav {
  opacity: 0;
  transition: opacity .15s ease-in-out;
  &:hover {
    opacity: 1;
  }
}

/** command palette **/
#command-palette[open] {
  --width: calc(var(--paper-width) - 80px);
  width: var(--width);
  max-height: 70%;
  position: fixed;
  top: 10%;
  left: calc((100% - var(--width)) / 2);
  border-radius: 1.5ex;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(0,0,0,.2);
  border: 1px solid var(--horizontal-line-color);
  background: var(--body-background-color);
  display: flex;
  flex-direction: column;
  padding: 0.7ex;

  form {
    display: contents;

    input {
      background: var(--paper-background-color);
      font-size: inherit;
      padding: 1ex 1.3ex;
      border: 1px solid var(--paper-outline-color);
      border-radius: 0.8ex;
      color: var(--body-font-color);
    }
  }

  ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    position: relative;
    margin-top: 0.7ex;
    gap: 1px;

    li {
      a {
        display: block;
        padding: 0.5ex 1.3ex;
        border-radius: 0.8ex;
        color: var(--body-font-color);
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      &:hover,
      &.selected {
        a {
          background: var(--paper-background-color);
        }
      }

      ::highlight(match) {
        background: yellow;
      }
    }
  }
}

/** names editor **/
#names-editor[open] {
  --width: calc(var(--paper-width) - 80px);
  width: var(--width);
  height: 80%;
  position: fixed;
  top: 10%;
  left: calc((100% - var(--width)) / 2);
  border-radius: 1.5ex;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0.7ex;
  padding: 0.7ex;

  form {
    display: contents;

    textarea {
      background: var(--paper-background-color);
      font-size: inherit;
      padding: 1ex 1.3ex;
      border: 1px solid var(--paper-outline-color);
      border-radius: 0.8ex;
      color: var(--body-font-color);
      flex: 1;
    }

    button {
      appearance: none;
      background: transparent;
      color: var(--body-font-color);
      width: 100%;
      min-width: 25px;
      display: grid;
      place-content: center;
      border-radius: 0.8ex;
      cursor: pointer;
      font-size: inherit;
      line-height: 1.8;
    }
  }
}

/** font picker **/
#font-picker[open] {
  --width: min(46ch, calc(var(--paper-width) - 80px));
  width: var(--width);
  max-height: 80%;
  position: fixed;
  top: 10%;
  left: calc((100% - var(--width)) / 2);
  border-radius: 1.5ex;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 0.7ex;
  padding: 0.7ex;

  /* the filter, which is the only input sitting directly in the dialog */
  > input {
    background: var(--paper-background-color);
    font: inherit;
    padding: 1ex 1.3ex;
    border: 1px solid var(--paper-outline-color);
    border-radius: 0.8ex;
    color: var(--body-font-color);
  }

  /* which of the two fonts the list is picking */
  .target {
    display: flex;
    gap: 0.5ex;

    button {
      flex: 1;
      text-align: center;
      outline: 1px solid var(--horizontal-line-color);

      &.selected {
        font-weight: bold;
      }
    }
  }

  label {
    display: grid;
    grid-template-columns: 7ch 1fr 8ch;
    align-items: center;
    gap: 1ex;
    padding: 0 1.3ex;
    font-size: 0.75em;

    input[type=range] {
      accent-color: var(--link-color);
      width: 100%;
      cursor: pointer;
    }
    span {
      text-align: right;
      opacity: 0.7;
    }
  }

  ul {
    flex: 1;
    overflow-y: auto;
    list-style: none;
  }

  small {
    padding: 0 1.3ex;
    opacity: 0.7;
    a {
      color: var(--link-color);
      cursor: pointer;
    }
  }

  button {
    appearance: none;
    background: transparent;
    color: var(--body-font-color);
    width: 100%;
    text-align: left;
    padding: 0.3ex 1.3ex;
    border-radius: 0.8ex;
    cursor: pointer;
    font-size: inherit;
    line-height: 1.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    &:hover,
    &:focus {
      background: var(--selection-bg);
    }
    /* the font in use, so the list says where you already are */
    &.selected {
      color: var(--link-color);
    }
  }
}

/** add name button **/
#add-name {
  position: fixed;
  z-index: 10;
  transform: translate3d(-50%, -100%, 0);
  display: flex;
  flex-direction: column;
  background: var(--paper-background-color);
  outline: 1px solid var(--horizontal-line-color);
  box-shadow: 0 3px 6px rgba(0, 0, 0, .2);
  border-radius: 0.8ex;
  corner-shape: squircle;
  max-width: 40ch;
  overflow: hidden;

  button {
    appearance: none;
    border: 0;
    background: none;
    color: var(--link-color);
    padding: 0.2ex 0.8ex;
    font: inherit;
    font-size: 0.7em;
    line-height: 1.7;
    white-space: nowrap;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;

    &:hover {
      color: var(--body-font-color);
    }

    /* one row per person to bind the name to, and the plain add last */
    & + button {
      border-top: 1px solid var(--horizontal-line-color);
    }
  }
}

.text-left { text-align: left; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.indent-none { text-indent: 0; }
